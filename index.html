<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Y. R. Kirbi Simbolon · PHP Developer</title>
    <meta name="description" content="Portfolio of Y. R. Kirbi Simbolon, a PHP Developer. Laravel, Livewire, Yii2, and Vue.js work across product, inventory, orders, and payments.">
    <meta name="theme-color" content="#f3efe6">
    <link rel="icon" href="img/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,520;0,9..144,640;1,9..144,520&family=Outfit:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/switcher.css">
    <link id="template-css" rel="stylesheet" href="css/site.css">
    <script src="js/choose-template.js"></script>
    <script src="data/config.js"></script>
    <script>
      (function () {
        var cfg = window.PORTFOLIO || {};
        var ids = Object.keys(cfg.stylesheets || {});
        var query = new URLSearchParams(location.search).get("template");
        var stored = null;
        try { stored = localStorage.getItem("portfolio-template"); } catch (error) {}
        var id = window.chooseTemplate(ids, query, stored, cfg.defaultTemplate);
        document.documentElement.dataset.template = id || "modern";
        var link = document.getElementById("template-css");
        if (id && cfg.stylesheets && cfg.stylesheets[id]) link.href = cfg.stylesheets[id];
      })();
    </script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="template-switch">
      <label for="template-select">Template</label>
      <select id="template-select"></select>
    </div>
    <div id="app"></div>
    <noscript>
      <p class="noscript">This page builds both layouts from <code>data/profile.js</code> and needs JavaScript to show them.</p>
    </noscript>
    <script src="data/profile.js"></script>
    <script src="js/templates/modern.js"></script>
    <script src="js/templates/vcard.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
